name: "Build Android APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: "Export Godot Android APK"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup Godot Templates and Android Keystore"
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          fi
          mkdir -p build/android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore build/android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          ANDROID_SDK=""
          if [ -d "/usr/lib/android-sdk" ]; then
            ANDROID_SDK="/usr/lib/android-sdk"
          elif [ -d "/opt/android-sdk" ]; then
            ANDROID_SDK="/opt/android-sdk"
          elif [ -d "/root/android-sdk" ]; then
            ANDROID_SDK="/root/android-sdk"
          fi
          echo "Found Android SDK at: $ANDROID_SDK"
          printf "[gd_resource type=\"EditorSettings\" format=3]\n\n[resource]\nexport/android/android_sdk_path = \"%s\"\nexport/android/debug_keystore = \"build/android/debug.keystore\"\nexport/android/debug_keystore_user = \"androiddebugkey\"\nexport/android/debug_keystore_pass = \"android\"\n" "$ANDROID_SDK" > ~/.config/godot/editor_settings-4.tres

      - name: "Export Android APK"
        run: |
          mkdir -p build/android
          godot -v --headless --export-debug "Android" build/android/BlockCrash.apk

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "BlockCrash-Android-APK"
          path: build/android/BlockCrash.apk
          retention-days: 14
